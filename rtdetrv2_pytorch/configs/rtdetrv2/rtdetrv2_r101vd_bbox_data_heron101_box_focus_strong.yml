__include__: [
  './rtdetrv2_r101vd_bbox_data_heron101.yml',
]

# Stronger box-focused experiment: preserve the multiclass training signal, but
# lean harder toward localization quality in both matching and loss weighting.

output_dir: ./output/rtdetrv2_r101vd_bbox_data_heron101_box_focus_strong

RTDETRCriterionv2:
  weight_dict: {loss_vfl: 0.25, loss_bbox: 7, loss_giou: 3,}
  matcher:
    weight_dict: {cost_class: 0.5, cost_bbox: 6, cost_giou: 3}
