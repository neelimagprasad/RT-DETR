__include__: [
  './rtdetrv2_r101vd_6x_coco.yml',
]

# Finetune an RT-DETRv2-R101 (hidden_dim=384) model on local bbox_data COCO JSON.
# This config is designed to be compatible with Docling Heron-101 weights (HF).

output_dir: ./output/rtdetrv2_r101vd_bbox_data_heron101

num_classes: 17
remap_mscoco_category: False

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]
  class_agnostic: True

PResNet:
  pretrained: False

train_dataloader:
  total_batch_size: 1
  dataset:
    img_folder: rtdetrv2_pytorch/dataset/bbox_data/images_train/
    ann_file: rtdetrv2_pytorch/dataset/bbox_data/annotations/instances_train.json

val_dataloader:
  total_batch_size: 1
  dataset:
    img_folder: rtdetrv2_pytorch/dataset/bbox_data/images_test/
    ann_file: rtdetrv2_pytorch/dataset/bbox_data/annotations/instances_test.json

# Use a slightly hotter fine-tuning LR for the current bbox_data split while
# still keeping the pretrained backbone more conservative than the detector stack.
optimizer:
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000015
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00015

lr_scheduler:
  type: MultiStepLR
  milestones: [120, 240, 320]
  gamma: 0.2

# Use a longer warmup and later LR drops for the larger 400-epoch training run.
lr_warmup_scheduler:
  warmup_duration: 100

