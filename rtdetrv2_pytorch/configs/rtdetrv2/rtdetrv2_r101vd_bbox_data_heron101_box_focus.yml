__include__: [
  './rtdetrv2_r101vd_bbox_data_heron101.yml',
]

# Box-focused experiment: keep the 17-class setup, but reduce the influence of
# classification so matching and optimization care a bit more about localization.

output_dir: ./output/rtdetrv2_r101vd_bbox_data_heron101_box_focus

RTDETRCriterionv2:
  weight_dict: {loss_vfl: 0.5, loss_bbox: 6, loss_giou: 3,}
  matcher:
    weight_dict: {cost_class: 1, cost_bbox: 5, cost_giou: 2}
